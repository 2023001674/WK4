<!DOCTYPE html>
<html>
<head>
    <title>GITAM Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .top {
            display: flex;
        }

        .logo {
            width: 30%;
        }

        .heading {
            width: 70%;
        }

        .menu {
            text-align: center;
            background-color: #333;
            padding: 10px;
        }

        .menu iframe {
            width: 100%;
            height: 40px;
            border: none;
        }

        .main {
            display: flex;
        }

        .left {
            width: 30%;
        }

        .right {
            width: 70%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .content-height {
            height: 400px;
        }
    </style>
</head>

<body>

<!-- Top Section -->
<div class="top">
    <div class="logo">
        <iframe src="logo.html"></iframe>
    </div>

    <div class="heading">
        <iframe src="heading.html"></iframe>
    </div>
</div>

<!-- Menu Section -->
<div class="menu">
    <iframe src="horizontal.html"></iframe>
</div>

<!-- Main Section -->
<div class="main content-height">
    <div class="left">
        <iframe src="left.html"></iframe>
    </div>

    <div class="right">
        <iframe src="about.html" name="contentFrame"></iframe>
    </div>
</div>

</body>
</html>
